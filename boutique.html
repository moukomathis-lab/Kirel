<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ma boutique – Kirel Occasion</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f2f6f4;--card:#fff;--ink:#14201b;--muted:#46564e;--line:#cbd7d1;--main:#0f6b4f;--on:#fff;--warn:#a4460b}
@media(prefers-color-scheme:dark){:root{--bg:#0f1613;--card:#17211c;--ink:#e6efea;--muted:#a3b3aa;--line:#2a3830;--main:#4fc79a;--on:#07261b;--warn:#f0a468}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 4px;color:var(--main)}
h2{font-size:18px;margin:20px 0 10px}
a{color:var(--main)}
.msg{min-height:1.5em;margin:8px 0;font-size:15px}
.msg.err{color:var(--warn);font-weight:600}
form,.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
label{font-size:14px;color:var(--muted);display:grid;gap:4px}
input{font:inherit;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--main);outline-offset:2px}
.btn{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-weight:600;font-size:15px}
.btn.main{background:var(--main);border-color:var(--main);color:var(--on)}
.btn:disabled{opacity:.6}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.top{display:flex;justify-content:space-between;gap:8px}
.statut{color:var(--muted);font-size:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>Ma boutique</h1>
<a href="occasion.html">← Retour au site</a>
<div id="msg" class="msg" role="status"></div>

<section id="auth" hidden>
<form id="fa">
<label>E-mail<input id="email" type="email" autocomplete="email"></label>
<label>Mot de passe (6 caractères minimum)<input id="pw" type="password" autocomplete="current-password"></label>
<button class="btn main" type="submit">Se connecter</button>
<button class="btn" type="button" id="signup">Créer un compte</button>
</form>
</section>

<section id="shop" hidden>
<form id="fs">
<strong>Crée ta boutique</strong>
<label>Nom de ta boutique<input id="snom" autocomplete="off"></label>
<label>Numéro WhatsApp, avec l’indicatif du pays<input id="swa" type="tel" inputmode="tel" placeholder="Exemple : 237600000000"></label>
<button class="btn main" type="submit">Créer ma boutique</button>
</form>
</section>

<section id="dash" hidden>
<div class="top"><strong id="hello"></strong><button class="btn" id="out" type="button">Quitter</button></div>
<h2>Ajouter un produit</h2>
<form id="fp">
<label>Nom du produit<input id="pnom" autocomplete="off"></label>
<div class="row">
<label>Prix<input id="pprix" type="number" inputmode="numeric" min="1"></label>
<label>Catégorie<input id="pcat" list="cats" autocomplete="off"></label>
</div>
<datalist id="cats"><option value="Téléphones"><option value="Vêtements"><option value="Maison"><option value="Électronique"></datalist>
<label>Photo<input id="pphoto" type="file" accept="image/*"></label>
<button class="btn main" type="submit" id="padd">Envoyer le produit</button>
</form>
<h2>Mes produits</h2>
<ul id="mine"></ul>
</section>
</main>

<script>
var SB_URL="https://ijblvmrfpihunnqmxftr.supabase.co";
var SB_KEY="sb_publishable_mc---_lwjH1Rr2-LIr67Cg_OtF5VXYj";
var db=supabase.createClient(SB_URL,SB_KEY);
var user=null,shop=null;
var STATUTS={en_attente:"En attente de validation",publie:"En ligne",refuse:"Refusé",vendu:"Vendu"};

function $(id){return document.getElementById(id)}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function msg(t,err){var m=$("msg");m.textContent=t||"";m.className="msg"+(err?" err":"")}
function show(id){["auth","shop","dash"].forEach(function(x){$(x).hidden=x!==id})}
function erreur(e){
  var t=(e&&e.message)||"";
  if(/invalid login/i.test(t))return "E-mail ou mot de passe incorrect.";
  if(/already registered|already been registered/i.test(t))return "Cet e-mail a déjà un compte. Connecte-toi.";
  if(/rate limit/i.test(t))return "Trop d’essais. Attends un peu puis réessaie.";
  return t||"Une erreur est survenue.";
}

async function start(){
  var r=await db.auth.getSession();
  user=r.data.session?r.data.session.user:null;
  if(!user){show("auth");return}
  var s=await db.from("boutiques").select("*").eq("id",user.id).maybeSingle();
  shop=s.data;
  if(!shop){show("shop");return}
  $("hello").textContent="Boutique : "+shop.nom;
  show("dash");loadMine();
}

async function connexion(mode){
  var email=$("email").value.trim(),pw=$("pw").value;
  if(!email||pw.length<6){msg("Entre ton e-mail et un mot de passe d’au moins 6 caractères.",1);return}
  msg("Un instant…");
  var r=mode==="up"?await db.auth.signUp({email:email,password:pw}):await db.auth.signInWithPassword({email:email,password:pw});
  if(r.error){msg(erreur(r.error),1);return}
  if(mode==="up"&&!r.data.session){msg("Compte créé. Ouvre l’e-mail reçu pour le confirmer, puis connecte-toi.");return}
  msg("");start();
}
$("fa").addEventListener("submit",function(e){e.preventDefault();connexion("in")});
$("signup").addEventListener("click",function(){connexion("up")});
$("out").addEventListener("click",async function(){await db.auth.signOut();msg("");start()});

$("fs").addEventListener("submit",async function(e){
  e.preventDefault();
  var nom=$("snom").value.trim(),wa=$("swa").value.replace(/\D/g,"");
  if(nom.length<2||wa.length<8){msg("Entre le nom de ta boutique et ton numéro WhatsApp avec l’indicatif.",1);return}
  var r=await db.from("boutiques").insert({id:user.id,nom:nom,whatsapp:wa});
  if(r.error){msg("Impossible de créer la boutique : "+erreur(r.error),1);return}
  msg("");start();
});

function reduire(file){
  return new Promise(function(ok,ko){
    var img=new Image(),u=URL.createObjectURL(file);
    img.onload=function(){
      var s=Math.min(1,1000/Math.max(img.width,img.height)),c=document.createElement("canvas");
      c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(u);
      c.toBlob(function(b){b?ok(b):ko()},"image/jpeg",0.8);
    };
    img.onerror=ko;img.src=u;
  });
}

$("fp").addEventListener("submit",async function(e){
  e.preventDefault();
  var nom=$("pnom").value.trim(),prix=Number($("pprix").value),cat=$("pcat").value.trim(),f=$("pphoto").files[0],btn=$("padd");
  if(nom.length<2||!(prix>0)||cat.length<2){msg("Entre le nom, le prix et la catégorie.",1);return}
  btn.disabled=true;msg("Envoi en cours…");
  var url=null;
  if(f){
    try{
      var b=await reduire(f),path=user.id+"/"+Date.now()+".jpg";
      var up=await db.storage.from("photos").upload(path,b,{contentType:"image/jpeg"});
      if(up.error)throw up.error;
      url=db.storage.from("photos").getPublicUrl(path).data.publicUrl;
    }catch(x){msg("La photo n’a pas pu être envoyée. Réessaie avec une autre photo.",1);btn.disabled=false;return}
  }
  var r=await db.from("produits").insert({boutique_id:user.id,nom:nom,prix:Math.round(prix),categorie:cat,photo_url:url});
  btn.disabled=false;
  if(r.error){msg("Le produit n’a pas pu être ajouté : "+erreur(r.error),1);return}
  $("fp").reset();
  msg("Produit envoyé. Il apparaîtra sur le site après validation.");
  loadMine();
});

async function loadMine(){
  var r=await db.from("produits").select("*,contacts(count)").eq("boutique_id",user.id).order("created_at",{ascending:false});
  var ul=$("mine");ul.innerHTML="";
  if(r.error){ul.appendChild(el("li","statut","Impossible de charger tes produits."));return}
  if(!r.data.length){ul.appendChild(el("li","statut","Tu n’as pas encore de produit."));return}
  r.data.forEach(function(p){
    var li=el("li","item"),top=el("div","top");
    top.appendChild(el("strong","",p.nom));
    top.appendChild(el("span","",Number(p.prix).toLocaleString("fr-FR")));
    li.appendChild(top);
    var n=p.contacts&&p.contacts[0]?p.contacts[0].count:0;
    li.appendChild(el("div","statut",(STATUTS[p.statut]||p.statut)+" · "+n+" contact"+(n>1?"s":"")));
    var acts=el("div","acts");
    if(p.statut==="publie"){
      var v=el("button","btn","Marquer vendu");v.type="button";
      v.addEventListener("click",async function(){await db.from("produits").update({statut:"vendu"}).eq("id",p.id);loadMine()});
      acts.appendChild(v);
    }
    var d=el("button","btn","Supprimer");d.type="button";
    d.addEventListener("click",async function(){
      if(confirm("Supprimer « "+p.nom+" » ?")){await db.from("produits").delete().eq("id",p.id);loadMine()}
    });
    acts.appendChild(d);li.appendChild(acts);ul.appendChild(li);
  });
}

start();
</script>
</body>
</html>
